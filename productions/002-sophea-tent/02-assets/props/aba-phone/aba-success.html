<!doctype html>
<meta charset="utf-8">
<title>ABA</title>
<style>
  html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
  .phone{width:390px;height:844px;background:#fff;position:relative;overflow:hidden;}
  .status{height:54px;display:flex;justify-content:space-between;padding:18px 22px 0;font-size:15px;font-weight:600;}
  .bar{height:48px;display:flex;align-items:center;padding:0 16px;gap:10px;border-bottom:1px solid #eee;}
  .logo{width:28px;height:28px;border-radius:50%;background:#e31c23;color:#fff;font:700 11px/28px sans-serif;text-align:center;}
  .bar b{font-size:16px;}
  .ok{text-align:center;padding:36px 24px 12px;}
  .check{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:#18a34a;color:#fff;font:700 40px/72px sans-serif;}
  .ok h1{margin:0;font-size:22px;font-weight:700;}
  .amt{font-size:34px;font-weight:800;margin:8px 0 4px;letter-spacing:-.5px;}
  .sub{color:#667;font-size:13px;}
  .card{margin:18px 16px;border:1px solid #eee;border-radius:12px;padding:14px 16px;font-size:14px;}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f3f3;}
  .row:last-child{border:0;}
  .k{color:#667;}
  .v{font-weight:600;text-align:right;}
  .btn{position:absolute;left:16px;right:16px;bottom:28px;height:48px;border:0;border-radius:10px;background:#e31c23;color:#fff;font-size:16px;font-weight:700;}
</style>
<div class="phone">
  <div class="status"><span>9:41</span><span>ABA</span></div>
  <div class="bar"><div class="logo">ABA</div><b>Transfer</b></div>
  <div class="ok">
    <div class="check">✓</div>
    <h1>Successful</h1>
    <div class="amt">USD 5,000.00</div>
    <div class="sub">ABA to ABA · Instant</div>
  </div>
  <div class="card">
    <div class="row"><span class="k">To</span><span class="v">Srey Pich</span></div>
    <div class="row"><span class="k">Account</span><span class="v">000 221 889</span></div>
    <div class="row"><span class="k">From</span><span class="v">Vireak · 000 118 442</span></div>
    <div class="row"><span class="k">Date</span><span class="v">21 Aug 2026, 19:06</span></div>
    <div class="row"><span class="k">Trx ID</span><span class="v">FT26082188421</span></div>
  </div>
  <button class="btn">Done</button>
</div>
